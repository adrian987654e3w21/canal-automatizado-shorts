# ============================================================
# Canal Automatizado Shorts — Docker Compose
#
#   docker compose up -d
#
# La configuracion vive TODA en .env (ver .env.example). Este fichero
# solo decide como se ejecuta: no dupliques aqui ninguna variable de
# contenido, o acabaras con el contenedor usando un .env y otro ajuste.
# ============================================================
services:
  shorts-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceless-shorts
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Artefactos de cada ejecucion (historial anti-repeticion incluido).
      - ./output:/app/output
      # Fondos: el sistema rota entre los clips que encuentra aqui.
      - ./assets/backgrounds:/app/assets/backgrounds:ro
      # Solo para el modo local (Ollama + Piper).
      - ollama_models:/data/ollama
      - ./assets/voices:/data/voices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  ollama_models:
