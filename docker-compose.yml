# ============================================================
# Canal Automatizado Shorts - Docker Compose
# Uso: docker compose up -d
# ============================================================
services:
  shorts-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceless-shorts
    restart: unless-stopped
    # Puertos: 3000 (app healthcheck), 11434 (Ollama API - solo interno)
    ports:
      - "3000:3000"
    volumes:
      # Persistencia de datos
      - ollama_models:/data/ollama
      - piper_voices:/data/voices
      - backgrounds:/data/backgrounds
      - output:/app/output
      # Configuración (opcional: monta tu .env local)
      - ./.env:/app/.env:ro
    environment:
      # --- MODO LOCAL GRATIS (por defecto) ---
      - USE_LOCAL_AI=true
      - OLLAMA_MODEL=llama3.1:8b
      - OLLAMA_TEMPERATURE=0.7
      - OLLAMA_MAX_TOKENS=1800
      - PIPER_MODEL=/data/voices/es_ES-sharvard-medium.onnx
      - PIPER_LENGTH_SCALE=1.0
      - PIPER_NOISE_SCALE=0.667
      - PIPER_NOISE_W=0.8
      - PIPER_SAMPLE_RATE=22050

      # --- CANAL Y CONTENIDO ---
      - CONTENT_NICHE=curiosidades del espacio
      - CONTENT_LANGUAGE=es-ES
      - TARGET_AUDIENCE=adultos curiosos de 18 a 34 años
      - TONE=curioso, claro, energético y creíble
      - CONTENT_GUARDRAILS=No inventes cifras, citas ni hechos; evita engaños y clickbait. No incluyas acotaciones, emojis, URLs ni hashtags dentro del guion.

      # --- PROGRAMACIÓN ---
      - CRON_SCHEDULE=0 10 * * *
      - CRON_TIMEZONE=America/Mexico_City
      - RUN_ON_START=false

      # --- VIDEO Y SUBTÍTULOS ---
      - BACKGROUND_FILE=/data/backgrounds/default.mp4
      - OUTPUT_DIR=/app/output
      - VIDEO_WIDTH=1080
      - VIDEO_HEIGHT=1920
      - VIDEO_FPS=30
      - VIDEO_CRF=20
      - VIDEO_PRESET=medium
      - SUBTITLE_MAX_CHARACTERS=40
      - SUBTITLE_MAX_DURATION_SECONDS=3.2
      - SUBTITLE_MAX_WORDS=8
      - SUBTITLE_FONT=Arial
      - SUBTITLE_FONT_SIZE=18
      - SUBTITLE_OUTLINE=4
      - SUBTITLE_MARGIN_V=220

      # --- PUBLICACIÓN YOUTUBE (rellena tras OAuth) ---
      - DRY_RUN=true
      - YOUTUBE_CLIENT_ID=
      - YOUTUBE_CLIENT_SECRET=
      - YOUTUBE_REFRESH_TOKEN=
      - YOUTUBE_REDIRECT_URI=http://localhost:3000/oauth2/callback
      - YOUTUBE_PRIVACY=unlisted
      - YOUTUBE_CATEGORY_ID=27
      - YOUTUBE_DEFAULT_TAGS=shorts,curiosidades,espacio
      - YOUTUBE_DESCRIPTION_FOOTER=Contenido generado con asistencia de inteligencia artificial.
      - YOUTUBE_MADE_FOR_KIDS=false
      - YOUTUBE_EMBEDDABLE=true
      - YOUTUBE_PLAYLIST_ID=

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  ollama_models:
  piper_voices:
  backgrounds:
  output: