name: 🎬 Long-Form Video Generator

on:
  schedule:
    # Lunes, miércoles y viernes a las 12:00 UTC
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # === CONFIGURACIÓN CANAL ===
  CONTENT_NICHE: curiosidades del espacio
  CONTENT_LANGUAGE: es-ES
  TARGET_AUDIENCE: adultos curiosos de 18 a 34 años
  TONE: apasionado, cercano, didáctico y sorprendente
  CONTENT_GUARDRAILS: No inventes cifras ni hechos; evita clickbait. Basa el contenido en ciencia real. No incluyas acotaciones ni formato Markdown en el guion.

  # === GUION LARGO (5-10 min ≈ 700-1400 palabras) ===
  SCRIPT_MIN_WORDS: 500
  SCRIPT_MAX_WORDS: 900
  MIN_SCRIPT_SECONDS: 200
  MAX_SCRIPT_SECONDS: 600

  # === IA LOCAL ===
  USE_LOCAL_AI: true
  OLLAMA_MODEL: llama3.1:8b
  OLLAMA_TEMPERATURE: 0.75
  OLLAMA_MAX_TOKENS: 6000
  PIPER_MODEL: /home/runner/voices/es_ES-sharvard-medium.onnx
  PIPER_LENGTH_SCALE: 1.0
  PIPER_NOISE_SCALE: 0.667
  PIPER_NOISE_W: 0.8
  PIPER_SAMPLE_RATE: 22050

  # === VIDEO HORIZONTAL 1080p ===
  VIDEO_WIDTH: 1920
  VIDEO_HEIGHT: 1080
  VIDEO_FPS: 30
  VIDEO_CRF: 18
  VIDEO_PRESET: medium
  SUBTITLE_MAX_CHARACTERS: 60
  SUBTITLE_MAX_DURATION_SECONDS: 4.0
  SUBTITLE_MAX_WORDS: 10
  SUBTITLE_FONT: Arial
  SUBTITLE_FONT_SIZE: 36
  SUBTITLE_OUTLINE: 5
  SUBTITLE_MARGIN_V: 80

  # === YOUTUBE ===
  DRY_RUN: false
  YOUTUBE_PRIVACY: unlisted
  YOUTUBE_CATEGORY_ID: 27
  YOUTUBE_DEFAULT_TAGS: curiosidades,espacio,ciencia,astronomia,universo
  YOUTUBE_DESCRIPTION_FOOTER: Contenido generado con asistencia de inteligencia artificial.
  YOUTUBE_MADE_FOR_KIDS: false
  YOUTUBE_EMBEDDABLE: true

jobs:
  generate-longform:
    name: Generate & Upload Long-Form Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates libespeak-ng1
          PIPER_VERSION="2023.11.14-2"
          sudo mkdir -p /opt/piper
          curl -fsSL "https://github.com/rhasspy/piper/releases/download/${PIPER_VERSION}/piper_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /opt/piper --strip-components=1
          sudo chmod +x /opt/piper/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          sudo cp /opt/piper/*.so* /usr/local/lib/ 2>/dev/null || true
          sudo ldconfig

      - name: 🎙️ Download Piper voice model
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/voices
          key: piper-voice-es-${{ runner.os }}-v1
      - name: 📥 Ensure Piper model exists
        if: steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/voices
          cd /home/runner/voices
          curl -fL -o es_ES-sharvard-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx"
          curl -fL -o es_ES-sharvard-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json"

      - name: 🦙 Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull ${{ env.OLLAMA_MODEL }}

      - name: 🎨 Generate background video
        id: bg-cache-lf
        uses: actions/cache@v4
        with:
          path: /home/runner/backgrounds-lf
          key: background-longform-${{ runner.os }}-v1
      - name: 🎬 Ensure background exists
        if: steps.bg-cache-lf.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/backgrounds-lf
          # Fondo espacial horizontal con estrellas y tonos azul/morado
          ffmpeg -y -f lavfi \
            -i "color=c=black:s=1920x1080:r=30" \
            -vf "
              geq=lum='if(lt(random(X+Y*1920)*random(X*1080+Y)*random(1+X+Y),0.00018),255*random(2+X*Y),0)':cb=128:cr=128,
              gblur=sigma=0.4,
              curves=r='0/0 0.3/0.08 1/0.25':g='0/0 0.3/0.1 1/0.35':b='0/0 0.3/0.35 1/0.85',
              format=yuv420p
            " \
            -t 60 -an -c:v libx264 -preset veryfast -crf 20 -movflags +faststart \
            /home/runner/backgrounds-lf/default.mp4

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🔐 Prepare environment
        run: |
          cat > .env <<'EOF'
          CONTENT_NICHE=${{ env.CONTENT_NICHE }}
          CONTENT_LANGUAGE=${{ env.CONTENT_LANGUAGE }}
          TARGET_AUDIENCE=${{ env.TARGET_AUDIENCE }}
          TONE=${{ env.TONE }}
          CONTENT_GUARDRAILS=${{ env.CONTENT_GUARDRAILS }}
          SCRIPT_MIN_WORDS=${{ env.SCRIPT_MIN_WORDS }}
          SCRIPT_MAX_WORDS=${{ env.SCRIPT_MAX_WORDS }}
          MIN_SCRIPT_SECONDS=${{ env.MIN_SCRIPT_SECONDS }}
          MAX_SCRIPT_SECONDS=${{ env.MAX_SCRIPT_SECONDS }}
          USE_LOCAL_AI=${{ env.USE_LOCAL_AI }}
          OLLAMA_MODEL=${{ env.OLLAMA_MODEL }}
          OLLAMA_TEMPERATURE=${{ env.OLLAMA_TEMPERATURE }}
          OLLAMA_MAX_TOKENS=${{ env.OLLAMA_MAX_TOKENS }}
          PIPER_MODEL=${{ env.PIPER_MODEL }}
          PIPER_LENGTH_SCALE=${{ env.PIPER_LENGTH_SCALE }}
          PIPER_NOISE_SCALE=${{ env.PIPER_NOISE_SCALE }}
          PIPER_NOISE_W=${{ env.PIPER_NOISE_W }}
          PIPER_SAMPLE_RATE=${{ env.PIPER_SAMPLE_RATE }}
          VIDEO_WIDTH=${{ env.VIDEO_WIDTH }}
          VIDEO_HEIGHT=${{ env.VIDEO_HEIGHT }}
          VIDEO_FPS=${{ env.VIDEO_FPS }}
          VIDEO_CRF=${{ env.VIDEO_CRF }}
          VIDEO_PRESET=${{ env.VIDEO_PRESET }}
          SUBTITLE_MAX_CHARACTERS=${{ env.SUBTITLE_MAX_CHARACTERS }}
          SUBTITLE_MAX_DURATION_SECONDS=${{ env.SUBTITLE_MAX_DURATION_SECONDS }}
          SUBTITLE_MAX_WORDS=${{ env.SUBTITLE_MAX_WORDS }}
          SUBTITLE_FONT=${{ env.SUBTITLE_FONT }}
          SUBTITLE_FONT_SIZE=${{ env.SUBTITLE_FONT_SIZE }}
          SUBTITLE_OUTLINE=${{ env.SUBTITLE_OUTLINE }}
          SUBTITLE_MARGIN_V=${{ env.SUBTITLE_MARGIN_V }}
          DRY_RUN=${{ env.DRY_RUN }}
          YOUTUBE_PRIVACY=${{ env.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID=${{ env.YOUTUBE_CATEGORY_ID }}
          YOUTUBE_DEFAULT_TAGS=${{ env.YOUTUBE_DEFAULT_TAGS }}
          YOUTUBE_DESCRIPTION_FOOTER=${{ env.YOUTUBE_DESCRIPTION_FOOTER }}
          YOUTUBE_MADE_FOR_KIDS=${{ env.YOUTUBE_MADE_FOR_KIDS }}
          YOUTUBE_EMBEDDABLE=${{ env.YOUTUBE_EMBEDDABLE }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REDIRECT_URI=http://localhost:3000/oauth2/callback
          BACKGROUND_FILE=/home/runner/backgrounds-lf/default.mp4
          OUTPUT_DIR=output
          EOF

      - name: 🚀 Generate & Upload Long-Form Video
        run: node index.js --now
        env:
          CRON_TIMEZONE: UTC

      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-output-${{ github.run_id }}
          path: output/**/*
          retention-days: 30

      - name: ❌ Notify on failure
        if: failure()
        run: echo "::error::Long-form video generation failed. Check workflow logs."
