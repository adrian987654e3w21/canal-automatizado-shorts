name: 🎬 Daily Short Generator

on:
  schedule:
    # Cada día a las 10:00 UTC (cambia cron si quieres otra hora)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Botón "Run workflow" en GitHub
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorts.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'

permissions:
  contents: read
  id-token: write

env:
  # === CONFIGURACIÓN CANAL ===
  CONTENT_NICHE: curiosidades del espacio
  CONTENT_LANGUAGE: es-ES
  TARGET_AUDIENCE: adultos curiosos de 18 a 34 años
  TONE: curioso, claro, energético y creíble
  CONTENT_GUARDRAILS: No inventes cifras, citas ni hechos; evita engaños y clickbait. No incluyas acotaciones, emojis, URLs ni hashtags dentro del guion.

  # === GUION (OpenAI GPT-4o-mini) ===
  USE_LOCAL_AI: false
  OPENAI_MODEL: gpt-4o-mini
  SCRIPT_MIN_WORDS: 120
  SCRIPT_MAX_WORDS: 160
  MIN_SCRIPT_SECONDS: 45
  MAX_SCRIPT_SECONDS: 65

  # === VOZ (ElevenLabs neural) ===
  ELEVENLABS_MODEL_ID: eleven_multilingual_v2
  ELEVENLABS_STABILITY: 0.5
  ELEVENLABS_SIMILARITY_BOOST: 0.85
  ELEVENLABS_STYLE: 0.2
  ELEVENLABS_SPEED: 1.0

  # === VIDEO ===
  VIDEO_WIDTH: 1080
  VIDEO_HEIGHT: 1920
  VIDEO_FPS: 30
  VIDEO_CRF: 18
  VIDEO_PRESET: medium
  SUBTITLE_MAX_CHARACTERS: 35
  SUBTITLE_MAX_DURATION_SECONDS: 3.0
  SUBTITLE_MAX_WORDS: 6
  SUBTITLE_FONT: Arial
  SUBTITLE_FONT_SIZE: 52
  SUBTITLE_OUTLINE: 6
  SUBTITLE_MARGIN_V: 180

  # === YOUTUBE ===
  DRY_RUN: false
  YOUTUBE_PRIVACY: unlisted
  YOUTUBE_CATEGORY_ID: 27
  YOUTUBE_DEFAULT_TAGS: shorts,curiosidades,espacio,ciencia,universo
  YOUTUBE_DESCRIPTION_FOOTER: Contenido generado con asistencia de inteligencia artificial.
  YOUTUBE_MADE_FOR_KIDS: false
  YOUTUBE_EMBEDDABLE: true

jobs:
  generate-short:
    name: Generate & Upload Short
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # 1. Checkout código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # 2. Setup Node.js
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      # 3. Instalar dependencias del sistema (solo ffmpeg — voz via ElevenLabs API)
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates

      # 4. Generar fondo de video (cacheado)
      - name: 🎨 Generate background video
        id: bg-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/backgrounds
          key: background-video-${{ runner.os }}-v3
      - name: 🎬 Ensure background exists
        if: steps.bg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/backgrounds
          ffmpeg -y -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -vf "
              geq=lum='if(lt(random(X+Y*1080)*random(X*1920+Y)*random(1+X+Y),0.00015),255*random(2+X*Y),0)':cb=128:cr=128,
              gblur=sigma=0.4,
              curves=r='0/0 0.3/0.08 1/0.25':g='0/0 0.3/0.1 1/0.35':b='0/0 0.3/0.35 1/0.85',
              format=yuv420p
            " \
            -t 60 -an -c:v libx264 -preset veryfast -crf 20 -movflags +faststart \
            /home/runner/backgrounds/default.mp4

      # 5. Instalar dependencias Node
      - name: 📦 Install Node dependencies
        run: npm ci
      
      # 8. Inyectar secrets de YouTube en .env
      - name: 🔐 Prepare environment
        run: |
          cat > .env <<'EOF'
          CONTENT_NICHE=${{ env.CONTENT_NICHE }}
          CONTENT_LANGUAGE=${{ env.CONTENT_LANGUAGE }}
          TARGET_AUDIENCE=${{ env.TARGET_AUDIENCE }}
          TONE=${{ env.TONE }}
          CONTENT_GUARDRAILS=${{ env.CONTENT_GUARDRAILS }}
          SCRIPT_MIN_WORDS=${{ env.SCRIPT_MIN_WORDS }}
          SCRIPT_MAX_WORDS=${{ env.SCRIPT_MAX_WORDS }}
          MIN_SCRIPT_SECONDS=${{ env.MIN_SCRIPT_SECONDS }}
          MAX_SCRIPT_SECONDS=${{ env.MAX_SCRIPT_SECONDS }}
          USE_LOCAL_AI=${{ env.USE_LOCAL_AI }}
          OPENAI_API_KEY=
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL=llama-3.1-8b-instant
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID=${{ env.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_STABILITY=${{ env.ELEVENLABS_STABILITY }}
          ELEVENLABS_SIMILARITY_BOOST=${{ env.ELEVENLABS_SIMILARITY_BOOST }}
          ELEVENLABS_STYLE=${{ env.ELEVENLABS_STYLE }}
          ELEVENLABS_SPEED=${{ env.ELEVENLABS_SPEED }}
          VIDEO_WIDTH=${{ env.VIDEO_WIDTH }}
          VIDEO_HEIGHT=${{ env.VIDEO_HEIGHT }}
          VIDEO_FPS=${{ env.VIDEO_FPS }}
          VIDEO_CRF=${{ env.VIDEO_CRF }}
          VIDEO_PRESET=${{ env.VIDEO_PRESET }}
          SUBTITLE_MAX_CHARACTERS=${{ env.SUBTITLE_MAX_CHARACTERS }}
          SUBTITLE_MAX_DURATION_SECONDS=${{ env.SUBTITLE_MAX_DURATION_SECONDS }}
          SUBTITLE_MAX_WORDS=${{ env.SUBTITLE_MAX_WORDS }}
          SUBTITLE_FONT=${{ env.SUBTITLE_FONT }}
          SUBTITLE_FONT_SIZE=${{ env.SUBTITLE_FONT_SIZE }}
          SUBTITLE_OUTLINE=${{ env.SUBTITLE_OUTLINE }}
          SUBTITLE_MARGIN_V=${{ env.SUBTITLE_MARGIN_V }}
          DRY_RUN=${{ env.DRY_RUN }}
          YOUTUBE_PRIVACY=${{ env.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID=${{ env.YOUTUBE_CATEGORY_ID }}
          YOUTUBE_DEFAULT_TAGS=${{ env.YOUTUBE_DEFAULT_TAGS }}
          YOUTUBE_DESCRIPTION_FOOTER=${{ env.YOUTUBE_DESCRIPTION_FOOTER }}
          YOUTUBE_MADE_FOR_KIDS=${{ env.YOUTUBE_MADE_FOR_KIDS }}
          YOUTUBE_EMBEDDABLE=${{ env.YOUTUBE_EMBEDDABLE }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REDIRECT_URI=http://localhost:3000/oauth2/callback
          BACKGROUND_FILE=/home/runner/backgrounds/default.mp4
          OUTPUT_DIR=output
          EOF
      
      # 9. Generar y subir Short
      - name: 🚀 Generate & Upload Short
        run: node index.js --now
        env:
          # GitHub Actions no soporta cron timezone, usamos UTC
          CRON_TIMEZONE: UTC
      
      # 10. Subir artefactos (MP4, logs) como artifacts de GitHub
      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-output-${{ github.run_id }}
          path: output/**/*
          retention-days: 30
      
      # 11. Notificar si falla (opcional: añade webhook Discord/Slack)
      - name: ❌ Notify on failure
        if: failure()
        run: |
          echo "::error::Short generation failed. Check workflow logs."
          # Aquí podrías añadir: curl -X POST $DISCORD_WEBHOOK ...