name: 🎬 Daily Short Generator

on:
  schedule:
    # Cada día a las 10:00 UTC (cambia cron si quieres otra hora)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Botón "Run workflow" en GitHub
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorts.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'

permissions:
  contents: read
  id-token: write

env:
  # === CONFIGURACIÓN CANAL (cambia aquí o usa secrets) ===
  CONTENT_NICHE: curiosidades del espacio
  CONTENT_LANGUAGE: es-ES
  TARGET_AUDIENCE: adultos curiosos de 18 a 34 años
  TONE: curioso, claro, energético y creíble
  CONTENT_GUARDRAILS: No inventes cifras, citas ni hechos; evita engaños y clickbait. No incluyas acotaciones, emojis, URLs ni hashtags dentro del guion.
  
  # === MODO LOCAL GRATIS (Ollama + Piper) ===
  USE_LOCAL_AI: true
  OLLAMA_MODEL: llama3.1:8b
  OLLAMA_TEMPERATURE: 0.7
  OLLAMA_MAX_TOKENS: 1800
  PIPER_MODEL: /home/runner/voices/es_ES-sharvard-medium.onnx
  PIPER_LENGTH_SCALE: 1.0
  PIPER_NOISE_SCALE: 0.667
  PIPER_NOISE_W: 0.8
  PIPER_SAMPLE_RATE: 22050
  
  # === VIDEO ===
  VIDEO_WIDTH: 1080
  VIDEO_HEIGHT: 1920
  VIDEO_FPS: 30
  VIDEO_CRF: 20
  VIDEO_PRESET: medium
  SUBTITLE_MAX_CHARACTERS: 40
  SUBTITLE_MAX_DURATION_SECONDS: 3.2
  SUBTITLE_MAX_WORDS: 8
  SUBTITLE_FONT: Arial
  SUBTITLE_FONT_SIZE: 18
  SUBTITLE_OUTLINE: 4
  SUBTITLE_MARGIN_V: 220
  
  # === YOUTUBE (se inyectan desde secrets) ===
  DRY_RUN: false
  YOUTUBE_PRIVACY: unlisted
  YOUTUBE_CATEGORY_ID: 27
  YOUTUBE_DEFAULT_TAGS: shorts,curiosidades,espacio
  YOUTUBE_DESCRIPTION_FOOTER: Contenido generado con asistencia de inteligencia artificial.
  YOUTUBE_MADE_FOR_KIDS: false
  YOUTUBE_EMBEDDABLE: true

jobs:
  generate-short:
    name: Generate & Upload Short
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # 1. Checkout código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # 2. Setup Node.js
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      # 3. Instalar dependencias del sistema (ffmpeg, piper)
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates libespeak-ng1
          # Piper TTS
          PIPER_VERSION=1.2.0
          curl -fsSL "https://github.com/rhasspy/piper/releases/download/v${PIPER_VERSION}/piper_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 piper/piper piper/libespeak-ng.so.1
          sudo chmod +x /usr/local/bin/piper
      
      # 4. Descargar modelo Piper (voz español) - cacheado
      - name: 🎙️ Download Piper voice model
        uses: actions/cache@v4
        with:
          path: /home/runner/voices
          key: piper-voice-es-${{ runner.os }}-v1
          restore-keys: |
            piper-voice-es-${{ runner.os }}-
      - name: 📥 Ensure Piper model exists
        if: steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/voices
          cd /home/runner/voices
          curl -fL -o es_ES-sharvard-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx"
          curl -fL -o es_ES-sharvard-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json"
      
      # 5. Instalar y arrancar Ollama
      - name: 🦙 Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          # Esperar a que Ollama responda
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # Descargar modelo LLM
          ollama pull ${{ env.OLLAMA_MODEL }}
      
      # 6. Generar fondo de video (cacheado)
      - name: 🎨 Generate background video
        uses: actions/cache@v4
        with:
          path: /home/runner/backgrounds
          key: background-video-${{ runner.os }}-v1
      - name: 🎬 Ensure background exists
        if: steps.bg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/backgrounds
          ffmpeg -y -f lavfi -i "color=c=0x07111F:s=1080x1920:r=30" \
            -vf "noise=alls=6:allf=t+u,format=yuv420p" \
            -t 60 -an -c:v libx264 -preset veryfast -crf 24 -movflags +faststart \
            /home/runner/backgrounds/default.mp4
      
      # 7. Instalar dependencias Node
      - name: 📦 Install Node dependencies
        run: npm ci
      
      # 8. Inyectar secrets de YouTube en .env
      - name: 🔐 Prepare environment
        run: |
          cat > .env <<'EOF'
          CONTENT_NICHE=${{ env.CONTENT_NICHE }}
          CONTENT_LANGUAGE=${{ env.CONTENT_LANGUAGE }}
          TARGET_AUDIENCE=${{ env.TARGET_AUDIENCE }}
          TONE=${{ env.TONE }}
          CONTENT_GUARDRAILS=${{ env.CONTENT_GUARDRAILS }}
          USE_LOCAL_AI=${{ env.USE_LOCAL_AI }}
          OLLAMA_MODEL=${{ env.OLLAMA_MODEL }}
          OLLAMA_TEMPERATURE=${{ env.OLLAMA_TEMPERATURE }}
          OLLAMA_MAX_TOKENS=${{ env.OLLAMA_MAX_TOKENS }}
          PIPER_MODEL=${{ env.PIPER_MODEL }}
          PIPER_LENGTH_SCALE=${{ env.PIPER_LENGTH_SCALE }}
          PIPER_NOISE_SCALE=${{ env.PIPER_NOISE_SCALE }}
          PIPER_NOISE_W=${{ env.PIPER_NOISE_W }}
          PIPER_SAMPLE_RATE=${{ env.PIPER_SAMPLE_RATE }}
          VIDEO_WIDTH=${{ env.VIDEO_WIDTH }}
          VIDEO_HEIGHT=${{ env.VIDEO_HEIGHT }}
          VIDEO_FPS=${{ env.VIDEO_FPS }}
          VIDEO_CRF=${{ env.VIDEO_CRF }}
          VIDEO_PRESET=${{ env.VIDEO_PRESET }}
          SUBTITLE_MAX_CHARACTERS=${{ env.SUBTITLE_MAX_CHARACTERS }}
          SUBTITLE_MAX_DURATION_SECONDS=${{ env.SUBTITLE_MAX_DURATION_SECONDS }}
          SUBTITLE_MAX_WORDS=${{ env.SUBTITLE_MAX_WORDS }}
          SUBTITLE_FONT=${{ env.SUBTITLE_FONT }}
          SUBTITLE_FONT_SIZE=${{ env.SUBTITLE_FONT_SIZE }}
          SUBTITLE_OUTLINE=${{ env.SUBTITLE_OUTLINE }}
          SUBTITLE_MARGIN_V=${{ env.SUBTITLE_MARGIN_V }}
          DRY_RUN=${{ env.DRY_RUN }}
          YOUTUBE_PRIVACY=${{ env.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID=${{ env.YOUTUBE_CATEGORY_ID }}
          YOUTUBE_DEFAULT_TAGS=${{ env.YOUTUBE_DEFAULT_TAGS }}
          YOUTUBE_DESCRIPTION_FOOTER=${{ env.YOUTUBE_DESCRIPTION_FOOTER }}
          YOUTUBE_MADE_FOR_KIDS=${{ env.YOUTUBE_MADE_FOR_KIDS }}
          YOUTUBE_EMBEDDABLE=${{ env.YOUTUBE_EMBEDDABLE }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REDIRECT_URI=http://localhost:3000/oauth2/callback
          BACKGROUND_FILE=/home/runner/backgrounds/default.mp4
          OUTPUT_DIR=output
          EOF
      
      # 9. Generar y subir Short
      - name: 🚀 Generate & Upload Short
        run: node index.js --now
        env:
          # GitHub Actions no soporta cron timezone, usamos UTC
          CRON_TIMEZONE: UTC
      
      # 10. Subir artefactos (MP4, logs) como artifacts de GitHub
      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-output-${{ github.run_id }}
          path: output/**/*
          retention-days: 30
      
      # 11. Notificar si falla (opcional: añade webhook Discord/Slack)
      - name: ❌ Notify on failure
        if: failure()
        run: |
          echo "::error::Short generation failed. Check workflow logs."
          # Aquí podrías añadir: curl -X POST $DISCORD_WEBHOOK ...